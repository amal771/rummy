<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Rummy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Full-screen fluorescent green pulse border on active turn -->
  <div id="turn-border-flash" class="turn-border hidden"></div>

  <!-- Inactive / Reduced-Time Rejoin Popup -->
  <div id="rejoin-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3>Turn Timer Reduced</h3>
      <p>You missed turns or went offline. Your timer is currently reduced.</p>
      <button id="btn-rejoin-active" class="btn primary-btn">Click to Join Back / Resume Active Play</button>
    </div>
  </div>

  <!-- Temporary Pure Sequence Broadcast Banner (5 Seconds) -->
  <div id="sequence-broadcast-banner" class="broadcast-banner hidden">
    <span id="broadcast-player-name"></span> revealed a Pure Sequence:
    <div id="broadcast-cards" class="card-strip"></div>
  </div>

  <!-- Top Room Bar -->
  <header class="game-header">
    <div class="room-info">
      Room: <span id="display-room-id">--</span> | 
      Timer: <span id="turn-timer-display" class="timer-text">--</span>
    </div>
    <div class="room-controls">
      <button id="btn-pause-toggle" class="btn">Pause Game</button>
      <button id="btn-leaderboard-toggle" class="btn">Points Table</button>
      <button id="btn-exit-lobby" class="btn danger-btn">Exit to Lobby</button>
    </div>
  </header>

  <!-- Table Felt & Piles -->
  <main class="table-surface">
    <div class="center-play-area">
      <!-- Closed Pile -->
      <div id="closed-pile" class="card-pile card-back">
        <span class="pile-count" id="closed-count">0</span>
      </div>

      <!-- Cut Joker Display -->
      <div id="cut-joker-slot" class="card-slot">
        <div id="cut-joker-card" class="card card-back">
          <span id="joker-placeholder-label">Hidden Joker</span>
        </div>
      </div>

      <!-- Open Discard Pile -->
      <div id="open-pile" class="card-pile empty-slot">
        <div id="top-open-card" class="card empty"></div>
      </div>
    </div>

    <!-- Active Player Hand & Controls Area -->
    <section class="player-hand-container">
      <div class="hand-action-bar">
        <button id="btn-reveal-joker" class="btn accent-btn hidden">Reveal Hidden Joker</button>
        <button id="btn-auto-sort" class="btn">Auto Sort</button>
        <button id="btn-drop" class="btn warning-btn">Drop / Fold</button>
        <button id="btn-declare" class="btn success-btn">Declare</button>
      </div>

      <!-- Grouped Card Melds Container -->
      <div id="melds-wrapper" class="melds-wrapper">
        <!-- Rendered dynamically into meld sections with badges -->
      </div>
    </section>
  </main>

  <!-- Full-Screen Points Table Modal -->
  <div id="leaderboard-modal" class="modal-overlay hidden">
    <div class="modal-box large-modal">
      <div class="modal-header">
        <h2>Points Table</h2>
        <button id="btn-close-leaderboard" class="close-x">&times;</button>
      </div>
      <table class="leaderboard-table" id="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th data-sort="totalPoints">Total Points</th>
            <th data-sort="averagePoints">Average Points</th>
            <th data-sort="gamesPlayed">Games</th>
            <th data-sort="gamesWon">Won</th>
            <th data-sort="gamesPerWin">Games / Win</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
